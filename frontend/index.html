<!doctype html>
<html lang="en" data-theme="dark-plus">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    />

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://ibrahim.example.com/" />
    <meta property="og:title" content="PortfolioOS | Mohamed Ibrahim Y" />

      property="og:description"
      content="I build and ship real software — REST APIs, CI/CD pipelines, and full-stack apps that go from my machine to a live URL."
    />

      property="og:image"
      content="https://ibrahim.example.com/assets/favicon/android-chrome-512x512.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://ibrahim.example.com/" />
    <meta property="twitter:title" content="PortfolioOS | Mohamed Ibrahim Y" />
    <meta
      property="twitter:description"
      content="I build and ship real software — REST APIs, CI/CD pipelines, and full-stack apps that go from my machine to a live URL."
    />
    <meta
      property="twitter:image"
      content="https://ibrahim.example.com/assets/favicon/android-chrome-512x512.png"
    />

    <!-- Favicons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <meta name="theme-color" content="#1e1e1e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Base -->
    <link rel="stylesheet" href="css/base/reset.css" />
    <link rel="stylesheet" href="css/base/variables.css" />
    <link rel="stylesheet" href="css/base/typography.css" />
    <!-- Themes -->
    <link rel="stylesheet" href="css/themes/dark-plus.css" />
    <link rel="stylesheet" href="css/themes/dracula.css" />
    <link rel="stylesheet" href="css/themes/one-dark-pro.css" />
    <link rel="stylesheet" href="css/themes/monokai.css" />
    <link rel="stylesheet" href="css/themes/nord.css" />
    <link rel="stylesheet" href="css/themes/solarized-dark.css" />
    <link rel="stylesheet" href="css/themes/night-owl.css" />
    <link rel="stylesheet" href="css/themes/light-plus.css" />
    <link rel="stylesheet" href="css/themes/solarized-light.css" />
    <link rel="stylesheet" href="css/themes/github-light.css" />
    <link rel="stylesheet" href="css/themes/project-hail-mary.css" />
    <link rel="stylesheet" href="css/themes/interstellar.css" />
    <link rel="stylesheet" href="css/themes/f1.css" />

    <!-- Components -->
    <link rel="stylesheet" href="css/layout/titlebar.css" />
    <link rel="stylesheet" href="css/layout/sidebar.css" />
    <link rel="stylesheet" href="css/layout/tabs.css" />
    <link rel="stylesheet" href="css/layout/content-pane.css" />
    <link rel="stylesheet" href="css/layout/statusbar.css" />

    <!-- Responsive Overrides -->
    <link rel="stylesheet" href="css/responsive/tablet.css" />
    <link rel="stylesheet" href="css/responsive/mobile.css" />

    <!-- Components -->
    <link rel="stylesheet" href="css/components/terminal.css" />
    <link rel="stylesheet" href="css/components/home.css" />
    <link rel="stylesheet" href="css/components/project-card.css" />
    <link rel="stylesheet" href="css/components/command-palette.css" />
    <link rel="stylesheet" href="css/components/skills.css" />
    <!-- Features -->
    <link rel="stylesheet" href="css/features/pets.css" />
    <!-- Responsive -->
    <link rel="stylesheet" href="css/responsive/tablet.css" />
    <link rel="stylesheet" href="css/responsive/mobile.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Title Bar -->
      <header class="titlebar">
        <div class="titlebar-controls-mac">
          <div class="mac-btn close"></div>
          <div class="mac-btn minimize"></div>
          <div class="mac-btn maximize"></div>
        </div>
        <div class="titlebar-title">PortfolioOS - Ibrahim</div>
        <div class="titlebar-actions">
          <button class="sidebar-toggle-btn" aria-label="Toggle Sidebar">
            ☰
          </button>
        </div>
      </header>

      <div class="main-body">
        <!-- Sidebar -->
        <aside class="sidebar">
          <div class="sidebar-header">EXPLORER</div>

          <!-- Pet Companion Container -->
          <div id="pet-container"></div>

          <div class="sidebar-content">
            <div class="tree-item folder expanded">
              <span class="chevron">▼</span>
              <span class="icon">📁</span> portfolio
            </div>
            <div class="tree-item file active">
              <span class="indent"></span><span class="icon">📄</span> Home.md
            </div>
            <div class="tree-item file">
              <span class="indent"></span><span class="icon">📄</span> About.md
            </div>
            <div class="tree-item file">
              <span class="indent"></span
              ><span class="icon">📄</span> Projects.json
            </div>
          </div>
        </aside>

        <!-- Main Workspace -->
        <main class="workspace">
          <!-- Tab Bar -->
          <nav class="tabs">
            <div class="tab active">
              <span class="icon">📄</span> Home.md
              <button class="close-btn">×</button>
            </div>
            <div class="tab">
              <span class="icon">📄</span> About.md
              <button class="close-btn">×</button>
            </div>
          </nav>

          <!-- Content Pane -->
          <article class="content-pane">
            <div
              style="
                display: flex;
                height: 100%;
                align-items: center;
                justify-content: center;
                color: var(--fg-muted);
              "
            >
              Loading...
            </div>
          </article>
        </main>
      </div>

      <!-- Terminal Panel -->
      <section class="terminal-panel collapsed" id="terminal-panel">
        <div class="terminal-header">
          <div class="terminal-tabs">
            <div class="term-tab active">TERMINAL</div>
            <div class="term-tab">OUTPUT</div>
            <div class="term-tab">DEBUG CONSOLE</div>
            <div class="term-tab">PORTS</div>
          </div>
          <div class="terminal-actions">
            <button class="term-action-btn" aria-label="Maximize">^</button>
            <button
              class="term-action-btn term-close-btn"
              aria-label="Close Terminal"
            >
              ×
            </button>
          </div>
        </div>
        <div class="terminal-body">
          <div class="terminal-output">
            <div class="terminal-line">
              PortfolioOS v0.1.0 — type 'help' to get started
            </div>
          </div>
          <div class="terminal-input-line">
            <span class="prompt">guest@portfolio:~$</span>
            <input
              type="text"
              id="terminal-input"
              class="cmd-input terminal-real-input"
              autocomplete="off"
              spellcheck="false"
              autofocus
            />
          </div>
          <div id="terminal-suggestions" class="terminal-suggestions"></div>
        </div>
      </section>

      <!-- Status Bar -->
      <footer class="statusbar">
        <div class="statusbar-left">
          <a
            href="https://github.com/Ibrahim-2005/portfolio"
            target="_blank"
            rel="noopener noreferrer"
            class="statusbar-item"
            title="GitHub Repository"
          >
            <span class="icon"></span> main
          </a>
        </div>
        <div class="statusbar-right">
          <span
            class="statusbar-item"
            title="Select Theme"
            id="status-theme-toggle"
            style="cursor: pointer"
          >
            <span class="icon">🎨</span>
            <span id="current-theme-name">Dark+</span>
          </span>
          <span class="statusbar-item">
            <span class="icon">✉</span> Contact
          </span>
          <button
            class="statusbar-item term-toggle-status-btn"
            title="Toggle Terminal"
          >
            <span class="icon">🖵</span>
          </button>
        </div>
      </footer>
    </div>

    <!-- Command Palette Overlay -->
    <div id="command-palette-overlay" class="command-palette-overlay">
      <div class="command-palette">
        <div class="cmd-input-wrapper">
          <input
            type="text"
            id="cmd-input"
            class="cmd-input"
            placeholder="Type a theme name (e.g., Dracula, Nord, F1)..."
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div id="cmd-list" class="cmd-list">
          <!-- Theme options injected here via JS -->
        </div>
      </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- App Entry Point -->
    <script type="module" src="js/main.js?v=6"></script>
    <script type="module" src="js/main.js?v=6"></script>
  </body>
</html>
